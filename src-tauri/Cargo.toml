[package]
name = "waid"
version = "0.1.0"
description = "WAID — What Am I Doing? A local-first project dashboard."
authors = ["Jelani John"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "waid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Dyn-dispatch for the LlmProvider trait (Ollama / Anthropic) — small, ubiquitous
# helper crate; the synthesis layer reaches local/remote models over plain HTTP
# (reqwest), never an in-process ML runtime.
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"], default-features = false }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# OS-keyring secret storage for authenticated integrations (private GitHub
# repos, etc.). Platform-native stores: macOS Keychain, Windows Credential
# Manager, Linux Secret Service (sync, pure-Rust crypto for the D-Bus session).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Gmail OAuth (desktop loopback + PKCE) is hand-rolled in commands.rs over the
# existing reqwest — no OAuth SDK. These are the minimal, ubiquitous primitives
# that flow needs: a localhost listener for the redirect (tokio::net), SHA-256 +
# base64url for the PKCE challenge, and OS entropy for the verifier/state. All
# were already in the dependency tree transitively; declaring them is free.
tokio = { version = "1", features = ["net", "time", "io-util"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
# Async runtime for ignored, on-demand live-integration diagnostics (the app
# itself gets its runtime from Tauri).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
